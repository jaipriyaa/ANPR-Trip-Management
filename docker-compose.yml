version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: anpr-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-anpr_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-anpr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anpr-network

  # 2. Redis Cache & Message Broker (Future-Ready)
  redis:
    image: redis:7-alpine
    container_name: anpr-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anpr-network

  # 3. FastAPI Backend & AI Pipeline
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: anpr-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@postgres:5432/${POSTGRES_DB:-anpr_db}
      - REDIS_URL=redis://redis:6379/0
      - MODEL_BACKEND=${MODEL_BACKEND:-AUTO}
      - GPU_ENABLED=${GPU_ENABLED:-false}
    volumes:
      - uploads_data:/app/backend/uploads
      - models_data:/app/models
      - logs_data:/app/logs
      - ./models:/app/models
      - ./backend/yolo11n.pt:/app/backend/yolo11n.pt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/system/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - anpr-network

  # 4. React Frontend (Nginx Production Server)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: anpr-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - anpr-network

networks:
  anpr-network:
    name: anpr-bridge-network
    driver: bridge

volumes:
  postgres_data:
    name: anpr_postgres_data
  redis_data:
    name: anpr_redis_data
  uploads_data:
    name: anpr_uploads_data
  models_data:
    name: anpr_models_data
  logs_data:
    name: anpr_logs_data
